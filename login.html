<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="row justify-content-center" >
                <h1><strong>GameZone</strong></h1>
                <img src="img/portada.jpg" alt="portada inicial gamezone" width="650" height="450">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="#login">Inicio sesión</a>
                    <a href="register.html">Registro de Usuario </a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <!-- Formulario Login -->
        <section id="login">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">

                        <h2 class="text-center mb-4">
                            Inicio de Sesión
                        </h2>

                        <form action=""
                        id="formulario-login"
                        class="border rounded py-4 px-4 shadow big-white">
                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo electrónico
                                </label>
                                <input 
                                type="email"
                                id="correo"
                                class="form-control"
                                placeholder="nombre@correo.cl">
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label">
                                    Contraseña
                                </label>
                                <input 
                                type="password"
                                id="contrasena"
                                class="form-control"
                                placeholder="Ingrese su contraseña">
                            </div>

                            <div>
                                <button type="submit" class="btn btn-primary w-100">
                                    Iniciar sesión
                                </button>
                            </div>
                            
                            <div
                            id="mensaje-resultado"
                            class="mt-4"
                            role="alert">                              
                            </div>

                        </form>
                    </div>            
                </div>
            </div> 
        </section>   
    </main>
    <footer id="contacto">
        <h2 class="mb-3"><strong>Contactanos</strong></h2>
        <p><strong>Correo:</strong> gamezone@store.com</p>
        <p><strong>Fono:</strong> +569 9324 159</p>
    </footer>
</body>
</html>
